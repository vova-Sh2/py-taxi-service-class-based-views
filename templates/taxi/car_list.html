{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <table>
      {% for car in car_list %}
        <li><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></li>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no Car</p>
  {% endif %}
{% endblock %}
