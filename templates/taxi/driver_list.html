{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  {% if driver_list %}
    <ul>
      {% for driver in driver_list %}
        <li>
          <a href="{% url 'taxi:driver-detail' driver.id %}">
            {{ driver.first_name }} {{ driver.last_name }}
            {% if driver.username %}
              ({{ driver.username }})
            {% endif %}
          </a>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
